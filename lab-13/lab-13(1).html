1. Write a program to greet the user according to the current time 
For example, if a user opens the page at 08:00 AM, the program should display 
“Good Morning”. (A)  

<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>lab-13-1</title>
</head>
<body>
	<h1 id="h1"></h1>
</body>
<script>
		let now=new Date();
		let hour=now.getHours();
		let h1=document.getElementById('h1');
		if(hour<5){
			h1.innerHTML="late night";
		}
		else if(hour<12){
			h1.innerHTML="Good morning";
		}
		else if(hour<18){
			h1.innerHTML="Good afternoon";
		}
		else if(hour<24){
			h1.innerHTML="good night";
		}

</script>
</html>
