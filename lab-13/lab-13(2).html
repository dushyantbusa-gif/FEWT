2. Write a program to recognize which keyboard event is fired. (A)

<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>lab-13-1</title>
</head>
<body>
	<h1 id="h1"></h1>
	<input type="text" name="" onkeydown="s('key down')" onkeyup="s('key up')">
</body>
<script>
		let h1=document.getElementById('h1');
		function s(value){
			h1.innerHTML=value;
		}	
</script>
</html>
