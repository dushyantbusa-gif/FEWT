<!-- 3. Write a program to demonstrate changing the properties of an HTML element using 
JavaScript. (B)  -->

<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>lab-13-1</title>
	<style>
		h1{
			color:red;
			background-color:black;
		}

	</style>
</head>
<body>
	<h1 id="h1">Chang Me</h1>
	<button onclick="chang()">clice me</button>
</body>
<script>
		function chang(){
				let h1=document.getElementById('h1');
				h1.style.backgroundColor="red";
				h1.style.color="black";
		}		
</script>
</html>
