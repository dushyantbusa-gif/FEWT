<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Simpal calculator</title>
</head>
<body>

</body>

<script>
	var a = parseInt(prompt("Entre the a "));
	var b = parseInt(prompt("Entre the b "));
	var ch = prompt("Entre the ch");

	if(ch=='+'){
		alert(a+b);
	}
	else if(ch=='-'){
		alert(a-b);
	}
	else if(ch=='*'){
		alert(a*b);
	}
	else if(ch=='/'){
		alert(a/b);
	}
	else if(ch=='%'){
		alert(a%b);
	}
	else{
		alert("Not valid");
	}
</script>
</html>
