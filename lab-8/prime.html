<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>prime or not prime</title>
</head>
<body>

</body>

<script>
	var a = parseInt(prompt("Entre the a "));
	var f=0;
	for(i=1;i<=a;i++){
		if(a%i==0){
			f++;
		}
	}
	if(f==2){
		alert("number is prime");
	}
	else{
		alert("number not prime");
	}
</script>
</html>
