<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>3</title>
</head>
<body id="body">
	<button onclick="show('Click Event')" ondblclick="show('Double Click Event')"
	    onmouseover="show('Mouse Over Event')" onmouseout="show('Mouse Out Event')"
	    onmousedown="show('Mouse Down Event')" onmouseup="show('Mouse Up Event')">click me</button>
</body>
<h1 id="h1"></h1>
<script>

function show(s){
	document.getElementById('h1').innerHTML=s;
}
</script>
