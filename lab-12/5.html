<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>3</title>
</head>
<body id="body">
	<input type="text" id="input"onkeydown="keycord(value)" onkeyup="up()">
</body>
<h1 id="h1"></h1>
<script>

function keycord(s){
	if(s=='a' ||s=='i' ||s=='o' ||s=='u' ||s=='e' ||
		s=='A' ||s=='E' ||s=='I' ||s=='O' ||s=='U')
	{
		document.getElementById('h1').innerHTML='value';
	}
	else{
		document.getElementById('h1').innerHTML=s;
	}
	
}
function up(){
	document.getElementById('body').style.backgroundColor='blue'
}
</script>
</html>
